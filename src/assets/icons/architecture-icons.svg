<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Shared duotone definitions -->
  <defs>
    <style>
      .arch-icon { fill: none; stroke: #00D2FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .arch-fill { fill: rgba(0, 210, 255, 0.14); stroke: none; }
    </style>
  </defs>

  <!-- 1. CLOUD -->
  <symbol id="icon-cloud" viewBox="0 0 32 32">
    <path class="arch-fill" d="M10 24h13a6 6 0 0 0 1-11.9 8 8 0 0 0-15.3 2.5A5.5 5.5 0 0 0 10 24z"/>
    <path class="arch-icon" d="M10 24h13a6 6 0 0 0 1-11.9 8 8 0 0 0-15.3 2.5A5.5 5.5 0 0 0 10 24z"/>
  </symbol>

  <!-- 2. ON-PREMISE (Server Rack) -->
  <symbol id="icon-onprem" viewBox="0 0 32 32">
    <rect class="arch-fill" x="5" y="5" width="22" height="9" rx="2"/>
    <rect class="arch-fill" x="5" y="18" width="22" height="9" rx="2"/>
    <rect class="arch-icon" x="5" y="5" width="22" height="9" rx="2"/>
    <rect class="arch-icon" x="5" y="18" width="22" height="9" rx="2"/>
    <circle cx="9" cy="9.5" r="1.2" fill="#00D2FF"/>
    <circle cx="13" cy="9.5" r="1.2" fill="#00D2FF"/>
    <line class="arch-icon" x1="18" y1="9.5" x2="23" y2="9.5"/>
    <circle cx="9" cy="22.5" r="1.2" fill="#00D2FF"/>
    <circle cx="13" cy="22.5" r="1.2" fill="#00D2FF"/>
    <line class="arch-icon" x1="18" y1="22.5" x2="23" y2="22.5"/>
  </symbol>

  <!-- 3. HYBRID (Bridge Gateway) -->
  <symbol id="icon-hybrid" viewBox="0 0 32 32">
    <circle class="arch-fill" cx="8" cy="16" r="4"/>
    <circle class="arch-fill" cx="24" cy="16" r="4"/>
    <circle class="arch-icon" cx="8" cy="16" r="4"/>
    <circle class="arch-icon" cx="24" cy="16" r="4"/>
    <path class="arch-icon" d="M12 16h8M16 11l5 5-5 5M16 21l-5-5 5-5"/>
  </symbol>

  <!-- 4. APPLICATION -->
  <symbol id="icon-app" viewBox="0 0 32 32">
    <rect class="arch-fill" x="4" y="6" width="24" height="20" rx="3"/>
    <rect class="arch-icon" x="4" y="6" width="24" height="20" rx="3"/>
    <line class="arch-icon" x1="4" y1="12" x2="28" y2="12"/>
    <circle cx="8" cy="9" r="1" fill="#00D2FF"/>
    <circle cx="12" cy="9" r="1" fill="#00D2FF"/>
    <circle cx="16" cy="9" r="1" fill="#00D2FF"/>
    <rect class="arch-icon" x="9" y="16" width="6" height="5" rx="1"/>
    <line class="arch-icon" x1="18" y1="17" x2="23" y2="17"/>
    <line class="arch-icon" x1="18" y1="20" x2="21" y2="20"/>
  </symbol>

  <!-- 5. DATABASE -->
  <symbol id="icon-database" viewBox="0 0 32 32">
    <path class="arch-fill" d="M6 9v14c0 2.8 4.5 5 10 5s10-2.2 10-5V9c0-2.8-4.5-5-10-5S6 6.2 6 9z"/>
    <ellipse class="arch-icon" cx="16" cy="9" rx="10" ry="4.5"/>
    <path class="arch-icon" d="M6 9v7c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5V9"/>
    <path class="arch-icon" d="M6 16v7c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5V16"/>
  </symbol>

  <!-- 6. IDENTITY & SECURITY -->
  <symbol id="icon-identity" viewBox="0 0 32 32">
    <path class="arch-fill" d="M16 4l10 4v8c0 6.5-4.5 11.5-10 13-5.5-1.5-10-6.5-10-13V8l10-4z"/>
    <path class="arch-icon" d="M16 4l10 4v8c0 6.5-4.5 11.5-10 13-5.5-1.5-10-6.5-10-13V8l10-4z"/>
    <circle class="arch-icon" cx="16" cy="13" r="2.8"/>
    <path class="arch-icon" d="M12 20.5c0-2.2 1.8-3.5 4-3.5s4 1.3 4 3.5"/>
  </symbol>

  <!-- 7. STORAGE -->
  <symbol id="icon-storage" viewBox="0 0 32 32">
    <rect class="arch-fill" x="5" y="7" width="22" height="18" rx="2.5"/>
    <rect class="arch-icon" x="5" y="7" width="22" height="18" rx="2.5"/>
    <circle class="arch-icon" cx="16" cy="16" r="4"/>
    <circle cx="16" cy="16" r="1.5" fill="#00D2FF"/>
    <circle cx="8.5" cy="10.5" r="1" fill="#00D2FF"/>
  </symbol>

  <!-- 8. QUEUE (Message Queue / Event Stream) -->
  <symbol id="icon-queue" viewBox="0 0 32 32">
    <rect class="arch-fill" x="4" y="11" width="6" height="10" rx="1.5"/>
    <rect class="arch-fill" x="13" y="11" width="6" height="10" rx="1.5"/>
    <rect class="arch-fill" x="22" y="11" width="6" height="10" rx="1.5"/>
    <rect class="arch-icon" x="4" y="11" width="6" height="10" rx="1.5"/>
    <rect class="arch-icon" x="13" y="11" width="6" height="10" rx="1.5"/>
    <rect class="arch-icon" x="22" y="11" width="6" height="10" rx="1.5"/>
    <path class="arch-icon" d="M7 7l4 4-4 4M25 17l-4 4 4 4"/>
  </symbol>

  <!-- 9. INTEGRATION (API & Webhook Nodes) -->
  <symbol id="icon-integration" viewBox="0 0 32 32">
    <circle class="arch-fill" cx="16" cy="8" r="3.5"/>
    <circle class="arch-fill" cx="8" cy="22" r="3.5"/>
    <circle class="arch-fill" cx="24" cy="22" r="3.5"/>
    <circle class="arch-icon" cx="16" cy="8" r="3.5"/>
    <circle class="arch-icon" cx="8" cy="22" r="3.5"/>
    <circle class="arch-icon" cx="24" cy="22" r="3.5"/>
    <path class="arch-icon" d="M14 11l-3.5 8M18 11l3.5 8M11.5 22h9"/>
  </symbol>
</svg>
