<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Face gradients for isometric refractive prism -->
    <linearGradient id="prism-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="prism-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14171F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="prism-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14171F" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Isometric Cube Facets -->
  <!-- Top Face (Cloud) -->
  <polygon points="32,8 52,19.5 32,31 12,19.5" fill="url(#prism-top)" stroke="#00D2FF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Face (On-Premise) -->
  <polygon points="12,19.5 32,31 32,54 12,42.5" fill="url(#prism-left)" stroke="#00D2FF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Face (Hybrid) -->
  <polygon points="32,31 52,19.5 52,42.5 32,54" fill="url(#prism-right)" stroke="#00D2FF" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner Converging Topology Beams -->
  <line x1="32" y1="18" x2="32" y2="31" stroke="#E6ECF2" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="36.5" x2="32" y2="31" stroke="#E6ECF2" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="42" y1="36.5" x2="32" y2="31" stroke="#E6ECF2" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Central Decision Nexus Node -->
  <g class="app-mark-nexus">
  <circle cx="32" cy="31" r="3.5" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="32" cy="31" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
